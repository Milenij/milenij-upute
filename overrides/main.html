{% extends "base.html" %}

{% block content %}

  {# Show the article's extra keywords as grey badges above the content (styled in stylesheets/extra.css) #}
  {% if page.meta.keywords %}
    <nav class="md-tags md-keywords">
      {% for keyword in page.meta.keywords %}
        <span class="md-tag md-keyword">{{ keyword }}</span>
      {% endfor %}
    </nav>
  {% endif %}

  {{ super() }}

{% endblock %}
