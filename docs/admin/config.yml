backend:
  name: git-gateway
  repo: milenij/milenij-upute
  branch: main
  auth_type: pkce
  base_url: "https://auth.decapbridge.com"
  auth_endpoint: /sites/52bcc5a8-1773-4be2-9a89-f2f8ab332807/pkce
  auth_token_endpoint: /sites/52bcc5a8-1773-4be2-9a89-f2f8ab332807/token
  gateway_url: "https://gateway.decapbridge.com"

# Uploaded images are stored in docs/assets/images and linked site-absolute,
# so the link works no matter how deep the article's folder is.
media_folder: "docs/assets/images"
public_folder: "/assets/images"
relative_links: false

commit_messages:
  create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Changes are saved as drafts (a cms/... pull request) and go live only once
# they are published/approved in the CMS workflow.
publish_mode: editorial_workflow

collections:
  - name: "tags"
    label: "Upravljaj oznakama"
    folder: "cms-data/tags" # Tag list for the "Oznake" field; not part of the site
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - {label: "Naziv oznake", name: "title", widget: "string"}

  # --- Article sections ---
  # Each section is a folder under docs/. To add a new section:
  #   1. copy one block below and change name, label and folder,
  #   2. add the folder name to the nav list in docs/.pages.

  - name: "fiskalizacija-2.0"
    label: "Fiskalizacija 2.0"
    folder: "docs/fiskalizacija-2.0"
    create: true
    nested: &nested { depth: 5, summary: "{{title}}" }
    meta: &meta { path: { widget: string, label: "Subfolder", index: true, index_file: "index", required: false } }
    # Shared article fields, reused by every section via *article_fields
    fields: &article_fields
      - {label: "Naslov", name: "title", widget: "string"}
      - label: "Oznake"
        name: "tags"
        widget: "relation"
        collection: "tags"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        multiple: true
        create: true
      - label: "Dodatne ključne riječi"
        name: "keywords"
        widget: "list"
        summary: "{{fields.keyword}}"
        minimize_collapsed: true
        hint: "Upišite specifične ključne riječi samo za ovaj članak."
        required: false
      - {label: "Tekst", name: "body", widget: "markdown"}

  - name: "nova-godina"
    label: "Nova godina"
    folder: "docs/nova-godina"
    create: true
    nested: *nested
    meta: *meta
    fields: *article_fields

  - name: "sidrene-cijene"
    label: "Sidrene (Bazne) Cijene"
    folder: "docs/sidrene-cijene"
    create: true
    nested: *nested
    meta: *meta
    fields: *article_fields
